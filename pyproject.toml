[project]
name = "temperq"
version = "0.0.1"
description = "TemperQ: local model training, account simulation and honest evaluation"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Dear-Huang"}]
requires-python = ">=3.10"
dependencies = [
    "baostock==0.9.4",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "lightgbm>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The installers also install third_party/ashare-tcost for net-of-cost checks.
dev = ["pytest>=8.0", "httpx>=0.27", "itsdangerous>=2.1", "jinja2>=3.1"]
# share site (server side only, not needed for local training)
site = ["httpx>=0.27", "itsdangerous>=2.1", "jinja2>=3.1"]
# Optional portfolio research requires Python >=3.11 (CVXPYlayers requirement).
e2e = ["torch==2.11.0", "cvxpylayers==1.2.0"]

[project.scripts]
temperq = "qwb.cli:main"
qwb = "qwb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qwb.rules" = ["*.yaml"]
"qwb" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
