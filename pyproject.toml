[project]
name = "qwb"
version = "0.0.1"
description = "Quant model workbench: point-in-time data, task cards, validation, packaging"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "lightgbm>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# ashare-tcost powers the net-of-cost check; until it is on PyPI the installers
# pick it up from a sibling checkout (../ashare-tcost)
dev = ["pytest>=8.0", "httpx>=0.27", "qwb[site]"]
# share site (server side only, not needed for local training)
site = ["httpx>=0.27", "itsdangerous>=2.1", "jinja2>=3.1"]

[project.scripts]
qwb = "qwb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
