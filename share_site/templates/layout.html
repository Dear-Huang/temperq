<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f9f7">
  <title>{{ title }} · TemperQ</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f6f9f7;color:#293d32;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:#39815c;text-decoration:none}a:hover{text-decoration:underline}header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1280px;margin:auto;padding:0 40px;border-bottom:1px solid #e0e9e2}.brand{font-size:19px;font-weight:650;color:#24382d;white-space:nowrap}.brand span{font-weight:400;color:#9aafa1;padding:0 4px}.account{font-size:12px;color:#7f9687}.account a{margin-left:14px}main{max-width:1200px;padding:34px 40px 70px;margin:auto}.breadcrumb{font-size:11px;display:flex;gap:12px;color:#93a699;margin-bottom:28px}.breadcrumb span{color:#b1c0b6}.eyebrow{font-size:9px;color:#94a99b;margin-bottom:10px}h2{font-size:30px;line-height:1.5;font-weight:550;overflow-wrap:anywhere;margin:8px 0 16px}h3{font-size:15px;font-weight:550;margin-top:26px}h2 span{font-size:13px;font-weight:400}main>p{font-size:12px;line-height:2;color:#8a9e90;overflow-wrap:anywhere}main>p a{display:inline-block}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:28px}.box{background:#fff;border:1px solid #e0e9e2;border-radius:7px;padding:24px;min-width:0}.box h3{margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid #edf2ee}.box h3 span{font-size:10px}.mut{color:#97aa9c}.warn{color:#b18b57}.dev-note{font-size:10px;padding:9px 13px;background:#f2f3e9;border:1px solid #e6eadc;color:#a29e79;border-radius:4px;margin-bottom:25px}table{border-collapse:collapse;width:100%;font-size:11px;background:#fff}td,th{border-bottom:1px solid #e9efea;padding:11px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}th{font-weight:500;color:#829989;width:40%}td{color:#597b65}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin:0;font:12px/2 -apple-system,"Microsoft YaHei",sans-serif;color:#708e79}input,textarea,button{font:inherit;max-width:100%;border-radius:5px;padding:10px 12px;border:1px solid #dce8df;background:#fff;color:#536d5c}input,textarea{margin:10px 0;line-height:1.8}textarea{resize:vertical}button{cursor:pointer;background:#2b4435;color:#fff;border-color:#2b4435;font-size:12px;padding:10px 17px}label{font-size:12px;color:#859c8d}footer{border-top:1px solid #e1e9e3;padding:26px 40px;max-width:1200px;margin:auto;color:#9fb0a3;font-size:10px;display:flex;justify-content:space-between;gap:20px}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #4d9370;outline-offset:4px}@media(max-width:720px){header{height:67px;padding:0 20px}.brand{font-size:15px}.account{font-size:10px}.account a{margin-left:8px}main{padding:25px 20px 45px}.cols{grid-template-columns:1fr;gap:18px;margin-top:22px}.box{padding:18px}h2{font-size:24px}.box h3{font-size:13px}th,td{font-size:10px;padding:10px 6px}footer{padding:22px 20px;flex-direction:column;gap:9px}.dev-note{font-size:9px}}
    .research-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:25px 0;border-top:1px solid #e0e9e2;border-bottom:1px solid #e0e9e2;margin:30px 0}.research-summary>div{display:flex;flex-direction:column;gap:9px;min-width:0}.research-summary span{font-size:10px;color:#8b9f92}.research-summary strong{font-size:25px;font-weight:500;color:#527b60;overflow-wrap:anywhere}.research-summary small{font-size:9px;color:#9aad9f}.recipe-block{background:#edf4ee;border:1px solid #e0e9e2;border-radius:5px;padding:20px;font:12px/2 Consolas,monospace}.research-summary>div:first-child strong{font-size:17px}@media(max-width:720px){.research-summary{gap:12px}.research-summary strong{font-size:20px}.research-summary>div:first-child strong{font-size:12px}.research-summary span{font-size:8px}.research-summary small{font-size:8px}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">TemperQ</a><div class="account">{% if user %}{{ user }}<a href="/logout">退出</a>{% else %}<a href="/login">登录 Hugging Face ↗</a>{% endif %}</div></header>
  <main>
    <div class="breadcrumb"><a href="/#community">模型广场</a><span>/</span>研究详情</div>
    {% if dev %}<div class="dev-note">本地开发模式：未配置 HF OAuth，仅限 127.0.0.1 访问，不可公开部署。</div>{% endif %}
    <div class="eyebrow">THE OPEN RESEARCH SPACE</div>
    {{ body|safe }}
  </main>
  <footer><span>TemperQ · 训练你自己的模型，看清你的每一笔持仓。</span><span>技术分享平台。不排名、不审核、不承诺收益，不构成投资建议。</span></footer>
</body>
</html>
